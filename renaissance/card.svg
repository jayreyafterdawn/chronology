<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif">
  <rect width="1200" height="630" fill="#f9f9f7"/>

  <!-- 격자: 1250–1650, x = 80 + (y-1250)*2.6 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="210" y1="215" x2="210" y2="565"/>
    <line x1="340" y1="215" x2="340" y2="565"/>
    <line x1="600" y1="215" x2="600" y2="565"/>
    <line x1="860" y1="215" x2="860" y2="565"/>
    <line x1="990" y1="215" x2="990" y2="565"/>
  </g>
  <g stroke="#c9c8c0" stroke-width="1.2">
    <line x1="470" y1="215" x2="470" y2="565"/>
    <line x1="730" y1="215" x2="730" y2="565"/>
    <line x1="1120" y1="215" x2="1120" y2="565"/>
  </g>
  <g fill="#898781" font-size="19" text-anchor="middle">
    <text x="210" y="205">1300</text>
    <text x="470" y="205" font-weight="700" fill="#52514e">1400</text>
    <text x="730" y="205" font-weight="700" fill="#52514e">1500</text>
    <text x="990" y="205">1600</text>
  </g>

  <!-- 제목 -->
  <text x="80" y="106" font-family="'Nanum Myeongjo','AppleMyungjo',Batang,Georgia,serif" font-size="58" font-weight="700" fill="#0b0b0b">이탈리아 르네상스 인물 연대표</text>
  <text x="80" y="150" font-size="24" fill="#52514e">단테부터 티치아노까지 — 르네상스를 만든 58인의 생애를 한 축 위에</text>

  <!-- 단테 · 문학 1265–1321, 전성기 1304–21 -->
  <g>
    <text x="119" y="252" font-size="17" fill="#52514e" font-weight="600">단테</text>
    <rect x="119" y="262" width="146" height="16" rx="8" fill="#cfe0db"/>
    <rect x="220" y="262" width="45" height="16" rx="8" fill="#2e7d6b"/>
    <circle cx="262" cy="270" r="7" fill="#2e7d6b" stroke="#f9f9f7" stroke-width="3"/>
  </g>
  <!-- 브루넬레스키 · 건축 1377–1446 -->
  <g>
    <text x="410" y="300" font-size="17" fill="#52514e" font-weight="600">브루넬레스키</text>
    <rect x="410" y="310" width="180" height="16" rx="8" fill="#ecd3ce"/>
    <rect x="517" y="310" width="73" height="16" rx="8" fill="#b5432e"/>
    <circle cx="564" cy="318" r="7" fill="#b5432e" stroke="#f9f9f7" stroke-width="3"/>
  </g>
  <!-- 코시모 데 메디치 · 후원 1389–1464 -->
  <g>
    <text x="441" y="348" font-size="17" fill="#52514e" font-weight="600">코시모 데 메디치</text>
    <rect x="441" y="358" width="196" height="16" rx="8" fill="#e9e1cb"/>
    <rect x="558" y="358" width="79" height="16" rx="8" fill="#a5821f"/>
    <circle cx="558" cy="366" r="7" fill="#a5821f" stroke="#f9f9f7" stroke-width="3"/>
  </g>
  <!-- 보티첼리 · 회화 1445–1510 -->
  <g>
    <text x="587" y="396" font-size="17" fill="#52514e" font-weight="600">보티첼리</text>
    <rect x="587" y="406" width="169" height="16" rx="8" fill="#cfd9eb"/>
    <rect x="670" y="406" width="47" height="16" rx="8" fill="#2d5fb0"/>
    <circle cx="691" cy="414" r="7" fill="#2d5fb0" stroke="#f9f9f7" stroke-width="3"/>
  </g>
  <!-- 레오나르도 다빈치 · 회화 1452–1519 -->
  <g>
    <text x="605" y="444" font-size="17" fill="#52514e" font-weight="600">레오나르도 다빈치</text>
    <rect x="605" y="454" width="174" height="16" rx="8" fill="#cfd9eb"/>
    <rect x="683" y="454" width="89" height="16" rx="8" fill="#2d5fb0"/>
    <circle cx="738" cy="462" r="7" fill="#2d5fb0" stroke="#f9f9f7" stroke-width="3"/>
  </g>
  <!-- 미켈란젤로 · 조각 1475–1564 -->
  <g>
    <text x="665" y="492" font-size="17" fill="#52514e" font-weight="600">미켈란젤로</text>
    <rect x="665" y="502" width="231" height="16" rx="8" fill="#e3dcd5"/>
    <rect x="725" y="502" width="171" height="16" rx="8" fill="#8a6b4f"/>
    <circle cx="740" cy="510" r="7" fill="#8a6b4f" stroke="#f9f9f7" stroke-width="3"/>
    <circle cx="761" cy="510" r="7" fill="#8a6b4f" stroke="#f9f9f7" stroke-width="3"/>
  </g>
  <!-- 티치아노 · 회화 1488–1576 -->
  <g>
    <text x="699" y="540" font-size="17" fill="#52514e" font-weight="600">티치아노</text>
    <rect x="699" y="550" width="228" height="16" rx="8" fill="#cfd9eb"/>
    <rect x="772" y="550" width="155" height="16" rx="8" fill="#2d5fb0"/>
    <circle cx="829" cy="558" r="7" fill="#2d5fb0" stroke="#f9f9f7" stroke-width="3"/>
  </g>

  <!-- 크레딧 -->
  <text x="1120" y="605" font-size="16" fill="#898781" text-anchor="end">chronology · 기획·제작 이정원</text>
</svg>
