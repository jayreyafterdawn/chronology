let lang = "ko";
const st = { theme: "auto", view: "normal" };
PEOPLE.sort((a, b) => a[2] - b[2] || a[3] - b[3]);

const $ = s => document.querySelector(s);

const glabel = k => CITIES[k][lang];
const aname = a => lang === "en" ? (NAME_EN[a[0]] || a[1]) : a[0];
const asub = a => lang === "en" ? a[0] : a[1];
const wtitle = t => lang === "en" ? (TITLE_EN[t] || t) : t;
const fmtT = t => lang === "en" ? `<i>${wtitle(t)}</i>` : `≪${t}≫`;
const lifeStr = (b, d) => `${fy(b)}–${fy(d)}`;

const active = new Set(Object.keys(FIELDS));
const activeGenres = new Set();
const passes = a => {
  const gOK = activeGenres.size === 0 || (CITY_OF[a[0]] || []).some(g => activeGenres.has(g));
  return active.has(a[4]) && gOK;
};

// ---- 상태 저장/복원 (localStorage + URL 해시) ----
function saveState() {
  const o = {
    lang, theme: st.theme, view: st.view,
    rg: active.size === Object.keys(FIELDS).length ? null : [...active],
    gn: activeGenres.size ? [...activeGenres] : null,
  };
  try { localStorage.setItem("renttl-state", JSON.stringify(o)); } catch (e) {}
  const h = ["lang=" + lang];
  if (o.rg) h.push("rg=" + o.rg.join(","));
  if (o.gn) h.push("gn=" + o.gn.join(","));
  if (st.view === "compact") h.push("view=compact");
  if (st.theme !== "auto") h.push("theme=" + st.theme);
  try { history.replaceState(null, "", "#" + h.join("&")); } catch (e) {}
}
function loadState() {
  let o = null;
  if (location.hash.length > 1) {
    const q = new URLSearchParams(location.hash.slice(1));
    o = { lang: q.get("lang"), theme: q.get("theme"), view: q.get("view"),
          rg: q.get("rg") ? q.get("rg").split(",") : null,
          gn: q.get("gn") ? q.get("gn").split(",") : null };
  } else {
    try { o = JSON.parse(localStorage.getItem("renttl-state")); } catch (e) {}
  }
  if (!o) return;
  if (o.lang === "en" || o.lang === "ko") lang = o.lang;
  if (Array.isArray(o.rg)) {
    active.clear();
    o.rg.forEach(k => FIELDS[k] && active.add(k));
    if (!active.size) Object.keys(FIELDS).forEach(k => active.add(k));
  }
  if (Array.isArray(o.gn)) o.gn.forEach(k => CITIES[k] && activeGenres.add(k));
  if (o.view === "compact") st.view = "compact";
  if (o.theme === "dark" || o.theme === "light") st.theme = o.theme;
}
function applyTheme() {
  if (st.theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = st.theme;
  const btn = $("#themeBtn");
  btn.textContent = st.theme === "auto" ? "◐" : st.theme === "dark" ? "☾" : "☀";
  btn.title = UI[lang].themeTitle[st.theme];
}

function buildRows() {
  const rows = $("#rows");
  let html = "";
  PEOPLE.forEach((a, i) => {
    const [ko, orig, b, d, fd, pk, works, rep] = a;
    const v = `var(${FIELDS[fd].v})`;
    const nm = aname(a);
    const lastYear = Math.max(d, works[works.length - 1][0]);
    let dots = "";
    works.forEach(([wy, wt, post], wi) => {
      dots += `<button class="dot${post ? " post" : ""}" style="left:${xg(wy)}px"
        data-i="${i}" data-w="${wi}"
        aria-label="${nm}, ${wtitle(wt)}, ${fy(wy)}"></button>`;
    });
    const repW = works[rep];
    html += `
    <div class="row" data-i="${i}" data-rg="${fd}" data-gn="${(CITY_OF[ko] || []).join(' ')}" style="--c:${v}">
      <div class="name-cell">
        <span class="a-name"><span class="sw"></span>${nm}</span>
        <span class="a-years">${lifeStr(b, d)} · ${rlabel(fd)}</span>
      </div>
      <div class="track" style="width:${W}px">
        <span class="life" style="left:${xg(b)}px;width:${xg(d) - xg(b)}px"></span>
        <span class="peak" style="left:${xg(pk[0])}px;width:${xg(pk[1]) - xg(pk[0])}px"></span>
        ${dots}
        <span class="rep" style="left:${xg(lastYear) + 14}px"><b>${fmtT(repW[1])}</b> ${fy(repW[0])}</span>
      </div>
    </div>`;
  });
  rows.innerHTML = html;
  rows.classList.toggle("compact", st.view === "compact");
}

function buildChips() {
  const t = UI[lang];
  let html = "";
  for (const [k, r] of Object.entries(FIELDS)) {
    const n = PEOPLE.filter(a => a[4] === k).length;
    html += `<button class="chip" data-rg="${k}" aria-pressed="true" style="--c:var(${r.v})">
      <span class="sw"></span>${r[lang]} <span class="n">${n}</span></button>`;
  }
  html += `<button class="chip reset" id="resetChip">${t.showAll}</button>`;
  html += `<button class="chip reset" id="noneChip">${t.clearAll}</button>`;
  html += `<span class="count" id="count"></span>`;

}

function buildGenreChips() {

function buildJumps() {

function buildTable() {
  const t = UI[lang];
  $("#datatable thead tr").innerHTML = t.thead.map(h => `<th>${h}</th>`).join("");
  $("#datatable tbody").innerHTML = PEOPLE.map(a => {
    const [ko, orig, b, d, fd, pk, works, rep] = a;
    const w = works.map(([wy, wt, post]) =>
      `${lang === "en" ? `<i>${wtitle(wt)}</i>` : `≪${wt}≫`} ${fy(wy)}${post ? "※" : ""}`).join(", ");
    return `<tr><td style="--c:var(${FIELDS[fd].v})"><span class="sw"></span><b>${aname(a)}</b></td>
      <td>${asub(a)}</td><td class="num">${lifeStr(b, d)}</td><td>${rlabel(fd)}</td>

function applyFilter() {
  document.querySelectorAll("#chips .chip[data-rg]").forEach(ch =>
    ch.setAttribute("aria-pressed", String(active.has(ch.dataset.rg))));
  document.querySelectorAll("#genreChips .gchip").forEach(ch =>
    ch.setAttribute("aria-pressed", String(activeGenres.has(ch.dataset.gn))));
  let shown = 0;
  document.querySelectorAll("#rows .row").forEach(r => {
    const on = passes(PEOPLE[+r.dataset.i]);
    r.style.display = on ? "" : "none";
    if (on) shown++;
  });
  $("#count").textContent = UI[lang].count(shown, PEOPLE.length);
  applySearch(false);
  drawMinimap();
  syncMmView();
  saveState();
}

function renderAll() {
  updateSwitch();
  applyTheme();
  renderStatic();
  buildRows();
  buildChips();
  buildGenreChips();
  buildJumps();
  buildTable();
  applyFilter();
}

// ---- 검색 ----
let query = "", hitEls = [], hitIdx = 0;
function applySearch(jump = true) {
  hitEls = [];
  document.querySelectorAll("#rows .row").forEach(r => {
    const a = PEOPLE[+r.dataset.i];
    const hit = !!query && (
      a[0].toLowerCase().includes(query) ||
      a[1].toLowerCase().includes(query) ||
      (NAME_EN[a[0]] || "").toLowerCase().includes(query));
    r.classList.toggle("hit", hit);
    r.classList.toggle("dim", !!query && !hit);
    if (hit && r.style.display !== "none") hitEls.push(r);
  });
  if (jump && hitEls.length) {
    hitIdx = 0;
    hitEls[0].scrollIntoView({ block: "center", inline: "nearest" });
  }
}
$("#searchBox").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  applySearch();
});
$("#searchBox").addEventListener("keydown", e => {
  if (e.key === "Enter" && hitEls.length) {
    hitIdx = (hitIdx + 1) % hitEls.length;
    hitEls[hitIdx].scrollIntoView({ block: "center", inline: "nearest" });
  }
  if (e.key === "Escape") {
    e.target.value = ""; query = ""; applySearch();
  }
});

// ---- 미니맵 ----
function drawMinimap() {
  const box = $("#minimap"), cvs = $("#mmc");
  const wCss = box.clientWidth, hCss = box.clientHeight;
  if (!wCss) return;
  const dpr = window.devicePixelRatio || 1;
  cvs.width = wCss * dpr; cvs.height = hCss * dpr;
  cvs.style.width = wCss + "px"; cvs.style.height = hCss + "px";
  const c = cvs.getContext("2d");
  c.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  c.clearRect(0, 0, wCss, hCss);
  const mx = y => xg(y) / W * wCss;
  ticks(Y0, Y1).forEach(tk => {
    if (!tk.strong) return;
    c.fillStyle = tok("--grid");
    c.fillRect(mx(tk.y), 0, 1, hCss);
  });
  const vis = PEOPLE.filter(passes);
  vis.forEach((a, r) => {
    const [, , b, d, fd] = a;
    const yy = 3 + (vis.length <= 1 ? 0 : r / (vis.length - 1) * (hCss - 6));
    c.strokeStyle = tok(FIELDS[fd].v);
    c.globalAlpha = 0.75;
    c.lineWidth = 1.2;
    c.beginPath();
    c.moveTo(mx(b), yy);
    c.lineTo(mx(d), yy);
    c.stroke();
  });
  c.globalAlpha = 1;
}
function syncMmView() {
  const sc = $("#scroll"), v = $("#mmview"), wCss = $("#minimap").clientWidth;
  if (!wCss) return;
  const winW = Math.max(0, sc.clientWidth - 216);
  const vw = Math.max(16, winW / W * wCss);
  const left = Math.min(sc.scrollLeft / W * wCss, wCss - vw);
  v.style.left = Math.max(0, left) + "px";
  v.style.width = vw + "px";
}
(function initMinimap() {
  const mm = $("#minimap");
  let drag = false;
  const go = e => {
    const r = mm.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const sc = $("#scroll");
    sc.scrollLeft = frac * W - (sc.clientWidth - 216) / 2;
  };
  mm.addEventListener("mousedown", e => { drag = true; go(e); e.preventDefault(); });
  window.addEventListener("mousemove", e => { if (drag) go(e); });
  window.addEventListener("mouseup", () => { drag = false; });
  mm.addEventListener("touchstart", e => go(e.touches[0]), { passive: true });
  mm.addEventListener("touchmove", e => go(e.touches[0]), { passive: true });
  $("#scroll").addEventListener("scroll", () => requestAnimationFrame(syncMmView));
  window.addEventListener("resize", () => { drawMinimap(); syncMmView(); });
})();

const tip = $("#tip");
let pinned = false;
function tipHTML(i, wi) {
  const a = PEOPLE[i];
  const [ko, orig, b, d, fd, pk, works, rep] = a;
  const t = UI[lang];
  const list = works.map(([wy, wt, post], j) =>
    `<li class="${j === wi ? "hl" : ""}">${fmtT(wt)} <span class="yr">${fy(wy)}${post ? t.posth : ""}</span></li>`).join("");
  const gn = (CITY_OF[ko] || []).map(glabel).join(" · ");
  return `<div class="t-name">${aname(a)}</div><div class="t-orig">${asub(a)}</div>
    ${gn ? `<div class="t-genre">${gn}</div>` : ""}
    <div class="t-meta" style="--c:var(${FIELDS[fd].v})"><span class="rg">${rlabel(fd)}</span> · ${lifeStr(b, d)} · ${t.peak} ${fy(pk[0])}–${fy(pk[1])}</div>
    <ul>${list}</ul>`;
}
function placeTip(cx, cy) {
  tip.style.display = "block";
  const rect = tip.getBoundingClientRect();
  let left = cx + 16, top = cy + 16;
  if (left + rect.width > innerWidth - 8) left = cx - rect.width - 12;
  if (top + rect.height > innerHeight - 8) top = cy - rect.height - 12;
  tip.style.left = Math.max(8, left) + "px";
  tip.style.top = Math.max(8, top) + "px";
}
function unpin() {
  pinned = false;
  tip.classList.remove("pinned");
  tip.style.display = "none";
}
const rowsEl = $("#rows");
rowsEl.addEventListener("mousemove", e => {
  if (pinned) return;
  const dot = e.target.closest(".dot");
  const row = e.target.closest(".row");
  if (!row) { tip.style.display = "none"; return; }
  tip.innerHTML = tipHTML(+row.dataset.i, dot ? +dot.dataset.w : -1);
  placeTip(e.clientX, e.clientY);
});
rowsEl.addEventListener("mouseleave", () => { if (!pinned) tip.style.display = "none"; });
rowsEl.addEventListener("click", e => {
  const dot = e.target.closest(".dot");
  const row = e.target.closest(".row");
  if (!row) return;
  pinned = true;
  tip.classList.add("pinned");
  tip.innerHTML = tipHTML(+row.dataset.i, dot ? +dot.dataset.w : -1) +
    `<button class="tclose" aria-label="닫기">×</button>`;
  placeTip(e.clientX, e.clientY);
  e.stopPropagation();
});
tip.addEventListener("click", e => { if (e.target.closest(".tclose")) unpin(); });
document.addEventListener("click", e => {
  if (pinned && !e.target.closest("#rows") && !e.target.closest("#tip")) unpin();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") unpin(); });
rowsEl.addEventListener("focusin", e => {
  if (pinned) return;
  const dot = e.target.closest(".dot");
  if (!dot) return;
  const r = dot.getBoundingClientRect();
  tip.innerHTML = tipHTML(+dot.dataset.i, +dot.dataset.w);
  placeTip(r.left + r.width / 2, r.bottom + 4);
});
rowsEl.addEventListener("focusout", () => { if (!pinned) tip.style.display = "none"; });

// ---- CSV 내보내기 (현재 필터·언어 반영) ----
function exportCSV() {
  const t = UI[lang];
  const rows = PEOPLE.filter(passes).map(a => {
    const [ko, orig, b, d, fd, pk, works, rep] = a;
    const w = works.map(([wy, wt, post]) =>
      `${wtitle(wt)} (${fy(wy)}${post ? (lang === "en" ? ", posth." : ", 사후") : ""})`).join("; ");
    return [aname(a), asub(a), lifeStr(b, d), rlabel(fd),
      (CITY_OF[ko] || []).map(glabel).join("; "),
      `${fy(pk[0])}–${fy(pk[1])}`, w];
  });
  const esc = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = "﻿" + [t.thead, ...rows].map(r => r.map(esc).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = (lang === "en" ? "italian-renaissance-figures" : "르네상스 인물 목록") + ".csv";
  link.click();
  // 샌드박스 등으로 자동 다운로드가 막힌 환경을 위한 복사 오버레이
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px";
  const hint = document.createElement("div");
  hint.textContent = lang === "en"
    ? "If the download didn't start, copy the CSV below and paste it into a spreadsheet or a .csv file."
    : "다운로드가 시작되지 않았다면, 아래 내용을 복사해서 스프레드시트나 .csv 파일에 붙여넣으세요.";
  hint.style.cssText = "color:#fff;font-size:13px;text-align:center;max-width:640px";
  const ta = document.createElement("textarea");
  ta.value = csv.replace("﻿", "");
  ta.readOnly = true;
  ta.style.cssText = "width:min(860px,92%);height:60%;border-radius:8px;border:none;padding:14px;font:11.5px/1.5 ui-monospace,Menlo,monospace;background:#fff;color:#111;white-space:pre";
  const btns = document.createElement("div");
  btns.style.cssText = "display:flex;gap:10px";
  const copyBtn = document.createElement("button");
  copyBtn.textContent = lang === "en" ? "Copy to clipboard" : "클립보드에 복사";
  const closeBtn = document.createElement("button");
  closeBtn.textContent = lang === "en" ? "Close" : "닫기";
  [copyBtn, closeBtn].forEach(b =>
    b.style.cssText = "padding:7px 22px;border-radius:999px;border:none;cursor:pointer;font-size:13px;font-family:inherit");
  copyBtn.onclick = () => {
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(() => {});
    copyBtn.textContent = lang === "en" ? "Copied!" : "복사됨!";
    setTimeout(() => { copyBtn.textContent = lang === "en" ? "Copy to clipboard" : "클립보드에 복사"; }, 1500);
  };
  closeBtn.onclick = () => { ov.remove(); URL.revokeObjectURL(url); };
  btns.append(copyBtn, closeBtn);
  ov.append(hint, ta, btns);
  document.body.appendChild(ov);
}
$("#csvBtn").addEventListener("click", exportCSV);

// ---- PNG 내보내기 (현재 필터·언어·테마 반영) ----
function roundRect(ctx, rx, ry, rw, rh, rr) {
  rr = Math.min(rr, rh / 2, Math.abs(rw) / 2);
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(rx, ry, rw, rh, rr); return; }
  ctx.moveTo(rx + rr, ry);
  ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, rr);
  ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, rr);
  ctx.arcTo(rx, ry + rh, rx, ry, rr);
  ctx.arcTo(rx, ry, rx + rw, ry, rr);
  ctx.closePath();
}

function exportPNG() {
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const surface = tok("--surface"), ink = tok("--ink"), ink2 = tok("--ink2"),
        muted = tok("--muted"), grid = tok("--grid"), gridS = tok("--grid-strong"),
        baseC = tok("--baseline");
  const parse = h => {
    h = h.replace("#", "");
    if (h.length === 3) h = h.split("").map(c => c + c).join("");
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  };
  const mix = (c1, c2, w) => {
    const a = parse(c1), b = parse(c2);
    return `rgb(${a.map((v, i) => Math.round(v * w + b[i] * (1 - w))).join(",")})`;
  };
  const SANS = 'system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const t = UI[lang];

  const visible = PEOPLE.filter(passes);
  if (!visible.length) return;

  // 표시된 인물들이 실제로 걸친 연도 구간만 그린다 (여백 최소화)
  let minY = Infinity, maxY = -Infinity;
  visible.forEach(a => {
    const [, , b, d, , , works] = a;
    minY = Math.min(minY, b);
    maxY = Math.max(maxY, d, works[works.length - 1][0]);
  });
  const start = Math.max(Y0, Math.floor((minY - 10) / 50) * 50);
  const end = Math.min(Y1, Math.ceil((maxY + 10) / 50) * 50);
  const ex = y => xg(y) - xg(start);
  const We = ex(end);

  // 활성 필터 요약 (전체 선택이면 생략)
  const fParts = [];
  if (active.size < Object.keys(FIELDS).length) {
    fParts.push((lang === "en" ? "Fields: " : "분야: ") +
      Object.keys(FIELDS).filter(k => active.has(k)).map(k => FIELDS[k][lang]).join(", "));
  }
  if (activeGenres.size > 0) {
    fParts.push((lang === "en" ? "Cities: " : "활동 무대: ") +
      Object.keys(CITIES).filter(k => activeGenres.has(k)).map(k => CITIES[k][lang]).join(", "));
  }
  const filterLine = fParts.join("   ·   ");

  const PAD = 28, NAME_W = 220, RIGHT = 240, HEAD = filterLine ? 114 : 96, AXIS = 30, ROW = 36, FOOT = 34;
  const width = PAD * 2 + NAME_W + We + RIGHT;
  const height = HEAD + AXIS + visible.length * ROW + FOOT;
  const SC = 2;
  const cv = document.createElement("canvas");
  cv.width = width * SC; cv.height = height * SC;
  const ctx = cv.getContext("2d");
  ctx.scale(SC, SC);

  ctx.fillStyle = surface;
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = ink;
  ctx.font = `700 26px GowunBatang, "Noto Serif KR", Georgia, "Apple SD Gothic Neo", serif`;
  ctx.fillText(t.title, PAD, PAD + 22);
  ctx.fillStyle = ink2;
  ctx.font = `12px ${SANS}`;
  ctx.fillText(t.sub, PAD, PAD + 44);
  if (filterLine) {
    ctx.fillStyle = ink;
    ctx.font = `600 11.5px ${SANS}`;
    ctx.fillText(filterLine, PAD, PAD + 63, width - PAD * 2);
  }

  let lx = PAD;
  const ly = PAD + 62 + (filterLine ? 19 : 0);
  const sampleCol = tok("--c-pai");
  const legendItem = (draw, label) => {
    draw();
    ctx.fillStyle = ink2;
    ctx.font = `11px ${SANS}`;
    ctx.fillText(label, lx, ly + 4);
    lx += ctx.measureText(label).width + 20;
  };
  legendItem(() => {
    ctx.fillStyle = mix(sampleCol, surface, 0.22);
    roundRect(ctx, lx, ly - 5, 26, 10, 5); ctx.fill(); lx += 32;
  }, t.legend[0]);
  legendItem(() => {
    ctx.fillStyle = sampleCol;
    roundRect(ctx, lx, ly - 5, 26, 10, 5); ctx.fill(); lx += 32;
  }, t.legend[1]);
  legendItem(() => {
    ctx.beginPath(); ctx.arc(lx + 5, ly, 5, 0, Math.PI * 2);
    ctx.fillStyle = sampleCol; ctx.fill(); lx += 16;
  }, t.legend[2]);
  legendItem(() => {
    ctx.beginPath(); ctx.arc(lx + 5, ly, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = surface; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = sampleCol; ctx.stroke(); lx += 16;
  }, t.legend[3]);

  const cx0 = PAD + NAME_W;
  const rowsTop = HEAD + AXIS;
  const rowsBot = rowsTop + visible.length * ROW;

  ticks(start, end).forEach(tk => {
    const gx = Math.round(cx0 + ex(tk.y)) + 0.5;
    ctx.strokeStyle = tk.strong ? gridS : grid;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(gx, rowsTop); ctx.lineTo(gx, rowsBot); ctx.stroke();
    if (!tk.label) return;
    ctx.fillStyle = tk.strong ? ink2 : muted;
    ctx.font = (tk.strong ? "700 " : "") + `10.5px ${SANS}`;
    ctx.textAlign = "center";
    ctx.fillText(fy(tk.y), gx, rowsTop - 9);
  });
  ctx.textAlign = "left";
  ctx.strokeStyle = baseC;
  ctx.beginPath(); ctx.moveTo(PAD, rowsTop - 0.5); ctx.lineTo(width - PAD, rowsTop - 0.5); ctx.stroke();
  ctx.fillStyle = muted;
  ctx.font = `10.5px ${SANS}`;
  ctx.fillText(t.axisTitle, PAD, rowsTop - 9);

  visible.forEach((a, r) => {
    const [ko, orig, b, d, fd, pk, works, rep] = a;
    const col = tok(FIELDS[fd].v);
    const yMid = rowsTop + r * ROW + ROW / 2;

    ctx.strokeStyle = mix(grid, surface, 0.55);
    ctx.beginPath();
    ctx.moveTo(PAD, rowsTop + (r + 1) * ROW - 0.5);
    ctx.lineTo(width - PAD, rowsTop + (r + 1) * ROW - 0.5);
    ctx.stroke();

    const nm = lang === "en" ? (NAME_EN[ko] || orig) : ko;
    ctx.fillStyle = col;
    roundRect(ctx, PAD, yMid - 11, 8, 8, 2); ctx.fill();
    ctx.fillStyle = ink;
    ctx.font = `600 12.5px ${SANS}`;
    ctx.fillText(nm, PAD + 13, yMid - 3, NAME_W - 30);
    ctx.fillStyle = muted;
    ctx.font = `10px ${SANS}`;
    ctx.fillText(`${lifeStr(b, d)} · ${rlabel(fd)}`, PAD + 13, yMid + 11, NAME_W - 30);

    const bx = cx0 + ex(b), bw = ex(d) - ex(b);
    ctx.fillStyle = mix(col, surface, 0.22);
    roundRect(ctx, bx, yMid - 6, bw, 12, 6); ctx.fill();

    ctx.fillStyle = col;
    roundRect(ctx, cx0 + ex(pk[0]), yMid - 6, ex(pk[1]) - ex(pk[0]), 12, 6); ctx.fill();

    works.forEach(([wy, wt, post]) => {
      const dx = cx0 + ex(wy);
      ctx.beginPath(); ctx.arc(dx, yMid, 5, 0, Math.PI * 2);
      if (post) {
        ctx.fillStyle = surface; ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
      } else {
        ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke();
      }
    });

    const lastYear = Math.max(d, works[works.length - 1][0]);
    const repW = works[rep];
    const lbl = lang === "en" ? (TITLE_EN[repW[1]] || repW[1]) : `≪${repW[1]}≫`;
    const lxx = cx0 + ex(lastYear) + 14;
    ctx.fillStyle = ink2;
    ctx.font = (lang === "en" ? "italic " : "") + `11px ${SANS}`;
    ctx.fillText(lbl, lxx, yMid + 4);
    const wpx = ctx.measureText(lbl).width;
    ctx.fillStyle = muted;
    ctx.font = `11px ${SANS}`;
    ctx.fillText(fy(repW[0]), lxx + wpx + 5, yMid + 4);
  });

  ctx.fillStyle = muted;
  ctx.font = `10px ${SANS}`;
  const today = new Date().toISOString().slice(0, 10);
  ctx.fillText(`${t.title} · ${UI[lang].count(visible.length, PEOPLE.length)} · ${today}`, PAD, rowsBot + 20);
  ctx.textAlign = "right";
  ctx.fillText(t.creditPlain, width - PAD, rowsBot + 20);
  ctx.textAlign = "left";

  cv.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = (lang === "en" ? "italian-renaissance-timeline" : "르네상스 인물 연대표") + ".png";
    link.click();
    // 샌드박스 등으로 자동 다운로드가 막힌 환경을 위한 미리보기 오버레이
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px";
    const hint = document.createElement("div");
    hint.textContent = lang === "en"
      ? "If the download didn't start, right-click (or long-press) the image and choose “Save Image As…”"
      : "다운로드가 시작되지 않았다면, 아래 이미지를 우클릭(트랙패드는 두 손가락 클릭)해서 '이미지를 다른 이름으로 저장'을 선택하세요.";
    hint.style.cssText = "color:#fff;font-size:13px;text-align:center;max-width:640px";
    const img = document.createElement("img");
    img.src = url;
    img.alt = UI[lang].title;
    img.style.cssText = "max-width:92%;max-height:78%;object-fit:contain;background:#fff;border-radius:8px;box-shadow:0 12px 44px rgba(0,0,0,.45)";
    const close = document.createElement("button");
    close.textContent = lang === "en" ? "Close" : "닫기";
    close.style.cssText = "padding:7px 22px;border-radius:999px;border:none;cursor:pointer;font-size:13px;font-family:inherit";
    close.onclick = () => { ov.remove(); URL.revokeObjectURL(url); };
    ov.append(hint, img, close);
    document.body.appendChild(ov);
  }, "image/png");
}
$("#exportBtn").addEventListener("click", exportPNG);

// ---- 초기 렌더 ----
loadState();
document.documentElement.lang = lang;
renderAll();
syncMmView();
</script>
